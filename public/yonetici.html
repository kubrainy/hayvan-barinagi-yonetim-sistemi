<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pet 4 Life</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/pets.css" />
  <script src="js/components.js"></script>
</head>
<body>
  <site-header user action-label="Çıkış" action-href="index.html"></site-header>

  <main class="page container">
    <section class="stats" aria-label="İstatistikler">
      <button type="button" class="stat is-active" data-filter="all" aria-pressed="true">
        <span class="stat__label">Toplam Hayvan</span>
        <span class="stat__value" id="toplam">...</span>
      </button>
      <button type="button" class="stat" data-filter="sahiplendi" aria-pressed="false">
        <span class="stat__label">Sahiplendirilen</span>
        <span class="stat__value" id="sahiplendirilen">...</span>
      </button>
      <button type="button" class="stat" data-filter="barinakta" aria-pressed="false">
        <span class="stat__label">Barınakta Kalan</span>
        <span class="stat__value" id="barinakta">...</span>
      </button>
      <button type="button" class="stat" data-scroll-to="request-panel" aria-controls="request-panel">
        <span class="stat__label">Bekleyen İstek</span>
        <span class="stat__value" id="istekler">...</span>
      </button>
    </section>

    <div class="admin-layout">
      <section class="animal-list">
        <div class="section-head">
          <h2 class="section-title">Hayvanlar</h2>
          <button type="button" class="btn btn--primary add-animal" data-modal-open="add-animal-modal">Hayvan Ekle</button>
        </div>
        <!-- Hayvan kartları buraya JS ile gelecek -->
        <div class="pet-grid" id="animal-grid"></div>
      </section>

      <section class="request-list panel" id="request-panel" tabindex="-1" aria-live="polite">
        <div class="section-head">
          <h2 class="section-title">Sahiplenme İstekleri</h2>
        </div>
        <!-- İstekler JS ile yüklenecek -->
        <div class="request-list__items" id="request-items"></div>
      </section>
    </div>
  </main>

  <site-footer></site-footer>

  <!-- Hayvan Ekleme Modalı -->
  <div id="add-animal-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="add-animal-title">
    <div class="modal__dialog" tabindex="-1">
      <button type="button" class="modal__close" data-modal-close aria-label="Kapat">&times;</button>
      <h2 class="modal__title" id="add-animal-title">Yeni Hayvan Ekle</h2>
      <form class="form form--plain" id="add-animal-form">
        <div class="form__grid">
          <div class="field field--full photo-field">
            <span class="label">Fotoğraf</span>
            <div class="photo-field__row">
              <img class="photo-field__preview" alt="Seçilen fotoğraf önizlemesi" role="button" tabindex="0" title="Büyütmek için tıkla" hidden />
              <label class="btn btn--secondary btn--sm photo-field__pick">
                <span class="photo-field__pick-text">Fotoğraf seç</span>
                <input class="visually-hidden" type="file" accept="image/*" data-photo-input />
              </label>
            </div>
            <input type="hidden" name="foto" />
          </div>
          <div class="field">
            <label class="label" for="add-ad">Adı</label>
            <input class="input" type="text" id="add-ad" name="ad" required />
          </div>
          <div class="field">
            <label class="label" for="add-cins">Cinsi</label>
            <input class="input" type="text" id="add-cins" name="cins" required />
          </div>
          <div class="field">
            <label class="label" for="add-dogum">Doğum Tarihi</label>
            <input class="input" type="date" id="add-dogum" name="dogumTarihi" required />
          </div>
          <div class="field">
            <label class="label" for="add-sehir">Şehir</label>
            <input class="input" type="text" id="add-sehir" name="sehir" placeholder="Bulunduğu şehir" required />
          </div>
          <div class="field field--full">
            <label class="label" for="add-iletisim">İletişim</label>
            <input class="input" type="tel" id="add-iletisim" name="iletisim" placeholder="05xx xxx xx xx" required />
          </div>
          <label class="checkbox field--full">
            <input type="checkbox" name="asi" /> Aşıları Yapıldı
          </label>
        </div>
        <div class="form__actions">
          <button type="button" class="btn btn--secondary" data-modal-close>Kapat</button>
          <button type="submit" class="btn btn--primary">Ekle</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Düzenleme Modalı -->
  <div id="edit-animal-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-animal-title">
    <div class="modal__dialog" tabindex="-1">
      <button type="button" class="modal__close" data-modal-close aria-label="Kapat">&times;</button>
      <h2 class="modal__title" id="edit-animal-title">Hayvanı Düzenle</h2>
      <form class="form form--plain" id="edit-animal-form">
        <input type="hidden" name="edit-id" />
        <div class="form__grid">
          <div class="field field--full photo-field">
            <span class="label">Fotoğraf</span>
            <div class="photo-field__row">
              <img class="photo-field__preview" alt="Hayvanın fotoğrafı" role="button" tabindex="0" title="Büyütmek için tıkla" hidden />
              <label class="btn btn--secondary btn--sm photo-field__pick">
                <span class="photo-field__pick-text">Fotoğraf seç</span>
                <input class="visually-hidden" type="file" accept="image/*" data-photo-input />
              </label>
            </div>
            <input type="hidden" name="edit-foto" />
          </div>
          <div class="field">
            <label class="label" for="edit-ad">Adı</label>
            <input class="input" type="text" id="edit-ad" name="edit-ad" required />
          </div>
          <div class="field">
            <label class="label" for="edit-cins">Cinsi</label>
            <input class="input" type="text" id="edit-cins" name="edit-cins" required />
          </div>
          <div class="field">
            <label class="label" for="edit-dogum">Doğum Tarihi</label>
            <input class="input" type="date" id="edit-dogum" name="edit-dogum" required />
          </div>
          <div class="field">
            <label class="label" for="edit-sehir">Şehir</label>
            <input class="input" type="text" id="edit-sehir" name="edit-sehir" required />
          </div>
          <div class="field field--full">
            <label class="label" for="edit-iletisim">İletişim</label>
            <input class="input" type="tel" id="edit-iletisim" name="edit-iletisim" required />
          </div>
          <label class="checkbox field--full">
            <input type="checkbox" name="edit-asi" /> Aşıları Yapıldı
          </label>
        </div>
        <div class="form__actions">
          <button type="button" class="btn btn--secondary" data-modal-close>Kapat</button>
          <button type="submit" class="btn btn--primary">Güncelle</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fotoğraf Önizleme Modalı (diğer pencerelerin üstünde açılması için en sonda) -->
  <div id="image-modal" class="modal" role="dialog" aria-modal="true" aria-label="Fotoğraf önizleme">
    <div class="modal__dialog modal__dialog--media" tabindex="-1">
      <button type="button" class="modal__close" data-modal-close aria-label="Kapat">&times;</button>
      <img id="modal-image" class="modal__image" alt="">
    </div>
  </div>

  <script src="js/yonetici.js"></script>
</body>
</html>
