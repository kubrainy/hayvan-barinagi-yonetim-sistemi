<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Üye Ol</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style1.css">
  <script src="components.js"></script>
</head>
<body>
  <site-header action-label="AnaSayfa" action-href="anasyf.html"></site-header>

  <main class="auth">
    <h2 class="auth__title">Üye Ol</h2>
    <form class="form form--wide" id="uyeForm">
      <div class="form__grid">
        <div class="field">
          <label class="label" for="ad">Ad</label>
          <input class="input" type="text" id="ad" name="ad" autocomplete="given-name">
        </div>
        <div class="field">
          <label class="label" for="soyad">Soyad</label>
          <input class="input" type="text" id="soyad" name="soyad" autocomplete="family-name">
        </div>
        <div class="field">
          <label class="label" for="yas">Yaş</label>
          <input class="input" type="text" id="yas" name="yas" inputmode="numeric">
        </div>
        <div class="field">
          <label class="label" for="tel">Tel No</label>
          <input class="input" type="tel" id="tel" name="tel" autocomplete="tel">
        </div>
        <div class="field">
          <label class="label" for="tc">TC</label>
          <input class="input" type="text" id="tc" name="tc" inputmode="numeric">
        </div>
        <div class="field">
          <label class="label" for="email">E-posta</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email">
        </div>
        <div class="field">
          <label class="label" for="user-id">ID (kullanıcı adı)</label>
          <input class="input" type="text" id="user-id" name="id" autocomplete="username">
        </div>
        <div class="field">
          <label class="label" for="password">Şifre</label>
          <input class="input" type="password" id="password" name="sifre" autocomplete="new-password">
        </div>
        <div class="field field--full">
          <label class="label" for="rol">Rol</label>
          <select class="input" id="rol">
            <option value="kullanici">Kullanıcı</option>
            <option value="yonetici">Yönetici</option>
          </select>
        </div>
        <div class="field field--full">
          <label class="label" for="adres">Adres</label>
          <textarea class="input" id="adres" name="adres" rows="3" autocomplete="street-address"></textarea>
        </div>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Üye Ol</button>
    </form>
  </main>

  <site-footer></site-footer>

  <script src="uyeol.js"></script>
</body>
</html>
